<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bagging Regressor Prediction</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2em;
      background-color: #f5f5f5;
    }
    .container {
      background-color: white;
      padding: 2em;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: auto;
    }
    label {
      display: block;
      margin-top: 1em;
    }
    input[type="number"], input[type="text"] {
      width: 100%;
      padding: 0.5em;
      margin-top: 0.3em;
    }
    button {
      margin-top: 1em;
      padding: 0.5em 1em;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
    }
    .result {
      margin-top: 1.5em;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Bagging Regressor Predictor!</h2>
  <form id="predictForm">
    <label for="feature1">Feature 1:</label>
    <input type="number" id="feature1" name="feature1" step="any" required>

    <label for="feature2">Feature 2:</label>
    <input type="number" id="feature2" name="feature2" step="any" required>
    <label for="feature2">Feature 2:</label>
    <input type="number" id="feature2" name="feature2" step="any" required>

    <!-- Add more features as needed -->

    <button type="submit">Predict</button>
  </form>

  <div class="result" id="result"></div>
</div>

<script>
  document.getElementById('predictForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const feature1 = parseFloat(document.getElementById('feature1').value);
    const feature2 = parseFloat(document.getElementById('feature2').value);

    // Simulate prediction (you'd replace this with a real API call)
    const prediction = (feature1 + feature2) / 2;  // Replace with actual backend call

    document.getElementById('result').innerText = 'Predicted Value: ' + prediction.toFixed(2);
  });
</script>

</body>
</html>
